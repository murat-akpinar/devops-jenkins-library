app_name: my-project
recipients: 'Takim_1, Takim_2'

# SSH kullanıcısı ve portu ortam bazında burada tanımlanır — globalConfig'te DEĞİL.
# globalConfig tüm projelerin paylaştığı tek dosyadır; bu değerler proje ve ortam
# bazında değiştiği için oraya sabitlenmemelidir.
environments:
  test:
    ssh_user: deploy      # opsiyonel: belirtilmezse Jenkinsfile'daki varsayılan kullanılır
    ssh_port: 22          # opsiyonel: belirtilmezse varsayılan 22 kullanılır
    deploy_targets:
      - 192.168.1.10
      - 192.168.1.11
  preprod:
    ssh_user: deploy
    ssh_port: 2222        # farklı port örneği
    deploy_targets:
      - 192.168.2.10
      - 192.168.2.11
  prod:
    ssh_user: root        # ortam başına farklı kullanıcı örneği
    # ssh_port belirtilmedi → otomatik 22
    deploy_targets:
      - 192.168.3.10
      - 192.168.3.11

services:
  - name: backend
    path: backend/
    dockerfile: Dockerfile          # varsayılan: Dockerfile
    target: runtime                 # opsiyonel: multi-stage Dockerfile'da build edilecek stage
    image_name: myapp_backend       # proje imaj adı
    env_file: backend/.env          # opsiyonel: build/deploy için .env
    extra_files:
      - { src: "default.conf", dest: "/app/my-project/default.conf" }

  - name: frontend
    path: frontend/
    dockerfile: Dockerfile
    image_name: myapp_frontend
    env_file: frontend/.env
    push_latest: false              # opsiyonel: :latest tag'i push edilmesin (varsayılan: true)

# ── Servis bazlı opsiyonel alanlar ──────────────────────────────────────────
#   scan_path                  : Checkov/OSV taramasının kapsayacağı dizin. Belirtilmezse
#                                `path` kullanılır. Build context'i repo kökü olmak zorunda
#                                olan servislerde (path: '.') gereklidir — aksi halde tarama
#                                tüm repoyu kapsar ve başka servislerin bağımlılıkları
#                                ikinci kez sayılıp proje notunu şişirir.
#   target                     : multi-stage Dockerfile'da build edilecek stage (--target)
#   push_latest                : false → :latest tag'i push edilmez (build cache'i zayıflar)
#   deploy_targets             : bu servise özel hedef IP listesi (environments'ı ezer)
#   ssh_user / ssh_port        : bu servise özel SSH kullanıcısı / portu
#   docker_compose_file        : yerel compose dosyası (varsayılan: docker-compose.yml)
#   docker_compose_remote_file : sunucuda saklanacak compose dosya adı
#   test_command               : container içinde çalıştırılacak test komutu
#
# NOT: checkDiff() artık submodule path'lerini tanır — `path` bir submodule ise
# superproject'teki gitlink bump'lanmamış olsa bile değişiklik yakalanır.
# `path` alanına liste de verilebilir (ör. [backend/, shared/]).
