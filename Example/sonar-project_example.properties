# sonarQubeAnalysis() bu dosyayı repo kökünden okur. Gerçek kullanımda dosya adı
# tam olarak "sonar-project.properties" olmalı (bu dosya sadece örnektir).

# --- Her proje tipinde zorunlu ---
sonar.projectKey=myapp
sonar.projectName=MyApp

# --- Ortak, opsiyonel — hem .NET hem generic yolda kullanılır ---
sonar.exclusions=**/bin/**,**/obj/**,**/node_modules/**,**/*.Designer.cs,**/*.g.cs,**/*.generated.cs
# Duplicate-code (CPD) taramasından hariç tutulacaklar — genelde otomatik üretilmiş dosyalar
sonar.cpd.exclusions=**/*.g.cs,**/*.generated.cs,**/*.Designer.cs
# Coverage raporu yoksa/istenmiyorsa quality gate'i coverage'a takılmaktan kurtarır
sonar.coverage.exclusions=**/*

# --- .sln bulunan (.NET) projelerde ---
# Repoda birden fazla .sln varsa manuel seçim gerekmez — hepsi otomatik bulunup tek
# analizde build edilir. DİKKAT: SonarScanner for .NET (v8+) bu dosyayı tanımıyor ve
# workspace'te görürse hata veriyor — sonarQubeAnalysis() yukarıdaki değerleri
# okuduktan sonra analiz süresince dosyayı geçici olarak kaldırıp geri koyuyor.
# sonar.sources / sonar.inclusions .NET yolunda kullanılmaz (kaynaklar build'den gelir).

# --- .sln bulunmayan projelerde (PHP, Node, Python, vb.) ---
# sonarQubeAnalysis() bu durumda düz `sonar-scanner` çalıştırır; bu dosya olduğu gibi
# kalır ve sources/inclusions dahil tüm ayarlar buradan okunur.
sonar.sources=src
sonar.inclusions=**/*.php
